# 저장소 루트에서 실행합니다.
# 기본 기동 확인 (모델 준비 전: /health의 model_loaded=false):
#   docker compose -f serving_app/docker-compose.yml up --build -d --wait
#
# B/C 통합 후 학습·Registry·예측 검증:
#   MOLDWEIGHT_BUILD_TARGET=trained MODEL_SOURCE=mlflow LOADING_MODE=eager \
#     docker compose -f serving_app/docker-compose.yml up --build -d --wait
#   scripts/smoke_test.sh
# 호스트 Python 없이 확인하려면:
#   docker compose -f serving_app/docker-compose.yml exec -T serving-app bash scripts/smoke_test.sh
# p95 측정 (예측 정상 동작 확인 후):
#   P95_SAMPLES=100 scripts/smoke_test.sh
#
# 업로드·로그·MLflow DB·아티팩트는 컨테이너 안에 저장합니다.
# restart는 상태를 유지하고, 컨테이너 재생성 시 이미지의 초기 상태로 돌아갑니다.
services:
  serving-app:
    image: moldweight-serving:${MOLDWEIGHT_BUILD_TARGET:-runtime}
    build:
      context: ..
      dockerfile: serving_app/Dockerfile
      target: ${MOLDWEIGHT_BUILD_TARGET:-runtime}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MOLDWEIGHT_PORT:-8000}:8000"
    environment:
      MODEL_SOURCE: ${MODEL_SOURCE:-local}
      LOADING_MODE: ${LOADING_MODE:-lazy}
      MLFLOW_TRACKING_URI: sqlite:////app/mlflow.db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
